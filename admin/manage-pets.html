<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>
  <div class="admin-panel">
    <!-- Sidebar -->
    <nav class="sidebar">
      <h2>Admin Panel</h2>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="manage-pets.html">Manage Pets</a></li>
        <li><a href="manage-events.html">Manage Events</a></li>
        <li><a href="manage-adoptions.html">Manage Adoption Applications</a></li>
        <li><a href="user-management.html">User Management</a></li>
        <li><a href="gallery-management.html">Gallery Management</a></li>
      </ul>
    </nav>

    <section id="manage-pets" class="admin-section">
        <h1>Manage Pets</h1>
        
        <!-- Add Pet Form -->
        <form id="add-pet-form">
            <h2>Add New Pet</h2>
            <div class="form-group">
                <label for="pet-name">Pet Name</label>
                <input type="text" id="pet-name" placeholder="Enter pet name" required>
            </div>
            <div class="form-group">
                <label for="pet-breed">Breed</label>
                <input type="text" id="pet-breed" placeholder="Enter pet breed" required>
            </div>
            <div class="form-group">
                <label for="pet-age">Age</label>
                <select id="pet-age" required>
                    <option value="" disabled selected>Select age group</option>
                    <option value="Puppy">Puppy</option>
                    <option value="Adult">Adult</option>
                    <option value="Senior">Senior</option>
                </select>
            </div>
            <div class="form-group">
                <label for="pet-image">Pet Image</label>
                <input type="file" id="pet-image" accept="image/*" required>
            </div>
            <button type="submit" class="add-pet-btn">Add Pet</button>
        </form>
    
        <!-- Pet List -->
        <h2>Pet List</h2>
        <table>
            <thead>
                <tr>
                    <th>Pet ID</th>
                    <th>Pet Name</th>
                    <th>Breed</th>
                    <th>Age</th>
                    <th>Image</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Example Pet Row -->
                <tr>
                    <td>1</td>
                    <td>Buddy</td>
                    <td>Labrador Retriever</td>
                    <td>Adult</td>
                    <td><img src="images/pet1.jpg" alt="Buddy" class="pet-thumbnail"></td>
                    <td>
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
     
      
      
  </div>
</body>
</html>
