<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt a Pet</title>
    <style>
         body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding-top: 80px;
            text-align: center;
        }
        
        /* General styling for form */
.adopt-form {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 40px;
    background-color: #fceded;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    height: 400px;
    margin-top: 30px;
}

/* Form header */
.adopt-form h2 {
    text-align: center;
    font-size: 24px;
    color: #333;
    margin-bottom: 10px;
}

/* Styling for form inputs */
.adopt-form input,
.adopt-form textarea,
.adopt-form select {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
   
}

/* Styling for buttons */
.adopt-form button {
    width: 100%;
    padding: 12px;
    background-color: #b18017;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
}

.adopt-form button:hover {
    background-color:  #6d4c03;
}

/* Label styling */
.adopt-form label {
    font-size: 16px;
    color: #333;
    margin-bottom: 8px;
    display: block;
}

/* Error message styling */
.error-message {
    color: red;
    font-size: 14px;
    margin-top: -10px;
    margin-bottom: 15px;
}
 /* Header */
 header {
            background-color: #6d4c03;
            padding: 1rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }
        header nav ul li {
            display: inline;
            margin: 0 15px;
        }
        header nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
         /* Footer */
         footer {
            background-color: #6d4c03;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="dashboard.jsp#home" class="nav-link">Home</a></li>
                <li><a href="dashboard.jsp#pet-listing" class="nav-link">Browse Pets</a></li>
                <li><a href="dashboard.jsp#apply" class="nav-link"> Volunteer</a></li>
                <li><a href="dashboard.jsp#events" class="nav-link">Events</a></li>
                <li><a href="dashboard.jsp#gallery" class="nav-link">Gallary</a></li>
                <li><a href="adopt.html">How to Adopt</a></li>
                <li><a href="sucess.html">Success Stories</a></li>
                <li><a href="about.html" >About Us</a></li>
                <li><a href="contactus.html" >Contact Us</a></li>

            </ul>
        </nav>
    </header>

    <section class="adopt-form">
        <h2>Adopt <span id="pet-name"></span></h2>
        <p>Please fill out the form below to apply for adopting this pet.</p>
        
        <form action="process_adoption.jsp" method="POST">
            <input type="text" name="reason" placeholder="Reason for adoption"  required>
            <input type="text" name="pet_name" id="pet_name" placeholder="Pet Name" required>
            <input type="text" name="pet_breed" id="pet_breed" placeholder="Pet Breed" required>
            <input type="text" name="pet_age" id="pet_age" placeholder="Pet Age"  required>
            <button type="submit">Submit Adoption Request</button>
        </form>
        
    </section>

    <script>
 
        // On page load, retrieve the selected pet details from localStorage
        document.addEventListener('DOMContentLoaded', function() {
            const pet = JSON.parse(localStorage.getItem('selectedPet'));
            if (pet) {
                // Dynamically show the pet's name on the form
                document.getElementById('pet-name').innerText = pet.name;
            } else {
                console.error("No pet data found in localStorage.");
            }
        });
    </script>
    <footer id="footer">
        <div class="container">
            <p>&copy; 2025 PetNest. All rights reserved. Made with ❤️ by Payal  </p>
           
        </div>
    </footer>
</body>
</html>
